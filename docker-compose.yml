version: '3.9'

services:
  ksp-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ksp-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_CATALYST_PROJECT_ID=${VITE_CATALYST_PROJECT_ID}
      - VITE_CATALYST_CLIENT_ID=${VITE_CATALYST_CLIENT_ID}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: local Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: ksp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ksp-frontend
    restart: unless-stopped
    profiles:
      - production
